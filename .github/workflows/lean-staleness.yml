name: Lean source staleness

on:
  pull_request:
    paths: ["src/**", "ext/**", "test/lean/**", ".github/workflows/lean-staleness.yml"]

permissions:
  contents: read

jobs:
  source-hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python test/lean/scripts/source-hashes.py check
