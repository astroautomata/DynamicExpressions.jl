name: Lean

on:
  pull_request:
    paths: ["test/lean/**", ".github/workflows/lean.yml"]
  push:
    branches: [master]
    paths: ["test/lean/**", ".github/workflows/lean.yml"]

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: test/lean
          use-github-cache: 'true'
          build: 'true'
          test: 'false'
          lint: 'false'
      - name: Audit the registry and run source checks
        working-directory: test/lean
        run: |
          ./scripts/audit.sh
          diff -u registry.tsv .lake/registry.tsv
